# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# `cargo deny check` runs it locally.

[advisories]
version = 2
# Unmaintained advisories fail only for workspace crates. Transitive dependencies
# with no available fix (derivative via sassy, custom_derive via rust-htslib's
# dev tree) are reported, not enforced; vulnerability advisories are always
# enforced.
unmaintained = "workspace"
# RUSTSEC-YYYY-NNNN ids listed here, each with a comment, accept an advisory
# that has no available fix.
ignore = []

[licenses]
version = 2
# whittle is Apache-2.0; the dependency tree is limited to permissive or
# file-level weak-copyleft licenses. bzip2-1.0.6 enters only through the
# Unix-only rust-htslib dev-dependency; MPL-2.0 is file-level copyleft and
# redistributable.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
