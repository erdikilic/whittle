# sassy's SIMD (AVX2) requires x86-64-v3 (Haswell/2015+) on x86-64; without this
# the crate fails to build. aarch64 uses NEON by default and needs no flag.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# The C compiler builds libdeflate for the same x86-64-v3 baseline, which
# enables its compile-time AVX2 and BMI2 paths in the compressor. The flag is
# set per target triple so aarch64 builds are unaffected.
[env]
CFLAGS_x86_64_unknown_linux_gnu = "-march=x86-64-v3"
CFLAGS_x86_64_unknown_linux_musl = "-march=x86-64-v3"
CFLAGS_x86_64_apple_darwin = "-march=x86-64-v3"
