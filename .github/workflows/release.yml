name: Release

on:
  push:
    # Bare version tags, e.g. 0.1.0 or 0.1.0-rc1, with no "v" prefix.
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-*"]
  # A manual run builds and checksums every target. Given an existing release
  # tag, it builds that tag and attaches the archives to its release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (empty: build only)"
        required: false
        default: ""

permissions:
  # Attaches binaries to the GitHub Release.
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, cc: musl-gcc }
          # x86-64-v4 archives: sassy searches adapters with AVX-512; they run only on
          # CPUs with AVX-512 and ship beside the x86-64-v3 archives.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, cpu: x86-64-v4 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, cc: musl-gcc, cpu: x86-64-v4 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Linux: installs the cross C toolchain and Rust target. This covers the
      # x86_64 glibc build and both aarch64 targets, using the runner's native
      # cross GCCs (cmake is present there for the zlib-ng C build) rather than
      # a container. sassy's SIMD resolves per architecture: x86_64 gets AVX2
      # via .cargo/config.toml, aarch64 uses baseline NEON.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: runner.os == 'Linux' && !matrix.cc
        with:
          target: ${{ matrix.target }}

      # x86_64 musl: Ubuntu's musl-gcc wraps the system GCC, which accepts the
      # x86-64-v3 baseline that .cargo/config.toml sets for C dependencies.
      - name: Add musl-gcc and Rust target (x86_64 musl)
        if: matrix.cc == 'musl-gcc'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      # macOS: native build; adds the Rust target for the active toolchain.
      - name: Add Rust target (macOS)
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"

      - uses: Swatinem/rust-cache@v2

      # RUSTFLAGS replaces the x86-64-v3 rustflags of .cargo/config.toml, and the
      # per-target CFLAGS replace its [env] value for the C dependencies.
      - name: Select the x86-64-v4 baseline
        if: matrix.cpu == 'x86-64-v4'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          echo "RUSTFLAGS=-C target-cpu=x86-64-v4" >> "$GITHUB_ENV"
          echo "CFLAGS_${TARGET//-/_}=-march=x86-64-v4" >> "$GITHUB_ENV"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      # The runner's CPU decides whether an x86-64-v4 binary can execute here.
      - name: Run the x86-64-v4 binary where AVX-512 is present
        if: matrix.cpu == 'x86-64-v4'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if grep -q avx512f /proc/cpuinfo; then
            "target/${TARGET}/release/whittle" --version
          else
            echo "::notice::This runner has no AVX-512; the x86-64-v4 binary was built but not run."
          fi

      - name: Package
        id: pkg
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.cpu && format('-{0}', matrix.cpu) || '' }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="whittle-${version}-${TARGET}${SUFFIX}"
          mkdir -p "dist/${name}"
          cp "target/${TARGET}/release/whittle" "dist/${name}/"
          # The committed man page, not a regenerated one: the cross-toolchain
          # action sets CARGO_BUILD_TARGET, so `cargo run` here would cross-build
          # the generator and execute it under QEMU, costing a full debug build of
          # the dependency tree per matrix leg. CI verifies the page is current.
          cp -R man "dist/${name}/"
          cp README.md CHANGELOG.md LICENSE "dist/${name}/"
          tar -C dist -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.tar.gz*

      - name: Attach to release
        if: github.event_name == 'push' || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.name }}.tar.gz
            ${{ steps.pkg.outputs.name }}.tar.gz.sha256
