# Formatting configuration for `whittle`.
#
# The unstable options in the "nightly" section require the nightly toolchain:
# `cargo +nightly fmt`. Stable `cargo fmt` runs and passes `--check` with this
# file; it ignores the unstable options and leaves the affected code as written.
#
# Comment- and string-reflowing options (wrap_comments, format_strings,
# format_code_in_doc_comments, normalize_comments) are not enabled: doc comments
# and multi-line error strings are hand-formatted.

# Width and general options (stable).
# rustfmt's default width.
max_width = 100
newline_style = "Unix"

# Expression and literal options (stable).
# `Foo { x }` instead of `Foo { x: x }`.
use_field_init_shorthand = true
# Trailing comma after block match arms.
match_block_trailing_comma = true
# `0x1f`, not `0x1F`.
hex_literal_case = "Lower"

# Import options (nightly).
# Merges `use a::b; use a::c;` into `use a::{b, c};`.
imports_granularity = "Module"
# Groups imports as std, external crates, this crate.
group_imports = "StdExternalCrate"
