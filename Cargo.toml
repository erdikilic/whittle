[package]
name = "whittle"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
description = "Coordinate-consistent trimming of long-read uBAM and tagged FASTQ"
authors = ["Erdi Kilic <erdican266@gmail.com>"]
repository = "https://github.com/erdikilic/whittle"
homepage = "https://github.com/erdikilic/whittle"
documentation = "https://docs.rs/whittle"
readme = "README.md"
keywords = ["bioinformatics", "nanopore", "long-read", "fastq", "bam"]
categories = ["science::bioinformatics", "command-line-utilities"]
exclude = ["/.github/"]

[[bin]]
name = "whittle"
path = "src/main.rs"

[lib]
name = "whittle"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
anyhow = "1"

rayon = "1"

seq_io = "0.3.4"
paraseq = { version = "0.6", default-features = false, features = ["anyhow"], optional = true }
noodles-bam = "0.95.0"
noodles-sam = "0.90.0"
noodles-bgzf = { version = "0.51.0", features = ["libdeflate"] }
libdeflater = "1"

flate2 = { version = "1", features = ["zlib-rs"], default-features = false }


sassy = { version = "0.2", default-features = false }
ensure_simd = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

indicatif = { version = "0.18", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
jiff = "0.2"

[features]
paraseq = ["dep:paraseq"]

[dev-dependencies]
assert_cmd = "2"
clap_mangen = "0.3"
predicates = "3"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rust-htslib = { version = "1.0", default-features = false, features = ["libdeflate"] }

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
